# Production stack for a single host (EC2). Run from the repo root:
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
# Build context is the repo root ("..") because this file lives in deploy/.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      API_PORT: "4000"
      API_CORS_ORIGIN: ${API_CORS_ORIGIN}
      # Scraping proxy for the Back Market price feed ({{URL}} = url-encoded target).
      # Direct fetches are blocked by DataDome, so leave empty to disable scraping.
      SCRAPER_PROXY_URL: ${SCRAPER_PROXY_URL:-}
      # ShipStation V2 — prepaid inbound labels. Leave API key empty to run with
      # stub labels. Set SHIPSTATION_TEST=false only when ready to buy real postage.
      SHIPSTATION_API_KEY: ${SHIPSTATION_API_KEY:-}
      SHIPSTATION_TEST: ${SHIPSTATION_TEST:-true}
      SHIPSTATION_SERVICE_CODE: ${SHIPSTATION_SERVICE_CODE:-usps_ground_advantage}
      SHIPSTATION_CARRIER_ID: ${SHIPSTATION_CARRIER_ID:-}
      SHIPSTATION_WEIGHT_OZ: ${SHIPSTATION_WEIGHT_OZ:-16}
      SHIPSTATION_DIMS_IN: ${SHIPSTATION_DIMS_IN:-}
      WAREHOUSE_NAME: ${WAREHOUSE_NAME:-}
      WAREHOUSE_PHONE: ${WAREHOUSE_PHONE:-}
      WAREHOUSE_STREET1: ${WAREHOUSE_STREET1:-}
      WAREHOUSE_STREET2: ${WAREHOUSE_STREET2:-}
      WAREHOUSE_CITY: ${WAREHOUSE_CITY:-}
      WAREHOUSE_STATE: ${WAREHOUSE_STATE:-}
      WAREHOUSE_ZIP: ${WAREHOUSE_ZIP:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "4000:4000"

  web:
    build:
      context: ..
      dockerfile: Dockerfile
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3100:3100"

volumes:
  pgdata:
